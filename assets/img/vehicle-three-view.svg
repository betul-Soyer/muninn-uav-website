<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img"
     aria-label="Schematic of GöğeBakan's three flight regimes: hover while tail-sitting on its wingtip fins, the pitch-over transition, and wing-borne cruise. Plan A profile: fixed-wing cruise, multicopter-mode search, fixed-wing return, vertical landing.">
  <defs>
    <pattern id="g2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e2025" stroke-width="1"/>
    </pattern>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#ff4d5a"/>
    </marker>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#a9aeb9"/>
    </marker>
  </defs>
  <rect width="920" height="400" fill="#101114"/>
  <rect width="920" height="400" fill="url(#g2)"/>

  <!-- ===== HOVER (front view, tail-sitting) ===== -->
  <g stroke="#d7dbe2" stroke-width="2" fill="none">
    <line x1="40" y1="300" x2="280" y2="300" stroke="#2e3138"/>
    <rect x="60" y="143" width="200" height="14" rx="7"/>
    <circle cx="160" cy="150" r="17" fill="#17181d" stroke="#ff4d5a"/>
    <g stroke="#8f96a3" stroke-dasharray="5 4">
      <ellipse cx="110" cy="116" rx="34" ry="6"/>
      <ellipse cx="210" cy="116" rx="34" ry="6"/>
    </g>
    <line x1="110" y1="122" x2="110" y2="143"/>
    <line x1="210" y1="122" x2="210" y2="143"/>
    <line x1="72" y1="157" x2="72" y2="297"/>
    <line x1="248" y1="157" x2="248" y2="297"/>
    <line x1="60" y1="297" x2="84" y2="297"/>
    <line x1="236" y1="297" x2="260" y2="297"/>
  </g>
  <g stroke="#a9aeb9" stroke-width="1.4">
    <line x1="110" y1="100" x2="110" y2="78" marker-end="url(#a4)"/>
    <line x1="210" y1="100" x2="210" y2="78" marker-end="url(#a4)"/>
  </g>
  <text x="160" y="340" text-anchor="middle" font-family="system-ui, Segoe UI, Roboto, Arial, sans-serif"
        font-size="13" letter-spacing="2.5" fill="#d7dbe2">HOVER — TAIL-SITTING</text>

  <!-- ===== TRANSITION (pitch-over) ===== -->
  <g stroke="#d7dbe2" stroke-width="5" stroke-linecap="round">
    <line x1="392" y1="128" x2="392" y2="204"/>
    <line x1="437" y1="151" x2="490" y2="112"/>
    <line x1="502" y1="238" x2="578" y2="238"/>
  </g>
  <g stroke="#8f96a3" stroke-width="2" fill="none">
    <ellipse cx="392" cy="120" rx="21" ry="4.5"/>
    <ellipse cx="496" cy="107" rx="14" ry="10" transform="rotate(-37 496 107)"/>
    <ellipse cx="494" cy="238" rx="4.5" ry="21"/>
  </g>
  <path d="M400 96 Q505 42 600 200" fill="none" stroke="#ff4d5a" stroke-width="2"
        stroke-dasharray="7 6" marker-end="url(#a2)"/>
  <text x="470" y="340" text-anchor="middle" font-family="system-ui, Segoe UI, Roboto, Arial, sans-serif"
        font-size="13" letter-spacing="2.5" fill="#d7dbe2">TRANSITION — PITCH-OVER</text>

  <!-- ===== CRUISE (side view) ===== -->
  <g stroke="#d7dbe2" stroke-width="2" fill="none">
    <ellipse cx="668" cy="160" rx="5" ry="30" stroke="#ff4d5a"/>
    <path d="M678 150 Q700 140 790 145 L856 152 Q872 156 872 161 Q872 168 852 171 L706 176 Q682 172 678 161 Z" fill="#17181d"/>
    <rect x="712" y="137" width="82" height="8" rx="4"/>
    <line x1="842" y1="146" x2="856" y2="126"/>
    <line x1="842" y1="174" x2="856" y2="194"/>
  </g>
  <g stroke="#2e3138" stroke-width="2">
    <line x1="884" y1="150" x2="906" y2="150"/>
    <line x1="880" y1="162" x2="908" y2="162"/>
    <line x1="884" y1="174" x2="906" y2="174"/>
  </g>
  <text x="775" y="340" text-anchor="middle" font-family="system-ui, Segoe UI, Roboto, Arial, sans-serif"
        font-size="13" letter-spacing="2.5" fill="#d7dbe2">CRUISE — WING-BORNE</text>

  <text x="26" y="36" font-family="system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="13"
        letter-spacing="3" fill="#d7dbe2">GOGEBAKAN — FLIGHT REGIMES (SCHEMATIC)</text>
  <text x="26" y="378" font-family="system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" fill="#a9aeb9">Plan A profile: fixed-wing cruise to the search area → multicopter-mode grid search → fixed-wing return → autonomous vertical landing.</text>
</svg>
