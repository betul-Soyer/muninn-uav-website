<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" role="img"
     aria-label="Top-view engineering sketch of GöğeBakan, a tail-sitter HSVTOL flying wing: two unified propulsion motors on the leading edge, elevons along the trailing edge, wingtip fins that double as landing gear, and a central pod with the nadir camera and AI companion computer.">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e2025" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="920" height="540" fill="#101114"/>
  <rect width="920" height="540" fill="url(#grid)"/>

  <!-- prop discs (unified propulsion, leading edge) -->
  <g stroke="#8f96a3" stroke-width="2" fill="none" stroke-dasharray="7 6">
    <circle cx="295" cy="178" r="58"/>
    <circle cx="625" cy="178" r="58"/>
  </g>
  <g stroke="#d7dbe2" stroke-width="4" stroke-linecap="round">
    <path d="M255 138 L335 218 M335 138 L255 218"/>
    <path d="M585 138 L665 218 M665 138 L585 218"/>
  </g>

  <!-- flying wing planform -->
  <path d="M460 120 L750 246 Q770 254 770 266 L770 292 Q770 304 752 306 L460 332 L168 306 Q150 304 150 292 L150 266 Q150 254 170 246 Z"
        fill="#1a1c22" stroke="#d7dbe2" stroke-width="2.5"/>
  <!-- elevon hinge lines -->
  <path d="M200 302 L436 324 M720 302 L484 324" stroke="#2e3138" stroke-width="2"/>
  <path d="M205 309 L433 330 M715 309 L487 330" stroke="#ff4d5a" stroke-width="2"/>

  <!-- wingtip fins / landing gear -->
  <rect x="143" y="252" width="12" height="60" rx="5" fill="#17181d" stroke="#d7dbe2" stroke-width="2"/>
  <rect x="765" y="252" width="12" height="60" rx="5" fill="#17181d" stroke="#d7dbe2" stroke-width="2"/>

  <!-- center pod -->
  <path d="M460 72 Q487 80 489 132 L489 298 Q489 330 460 337 Q431 330 431 298 L431 132 Q433 80 460 72 Z"
        fill="#17181d" stroke="#ff4d5a" stroke-width="2.5"/>
  <!-- nadir camera window -->
  <circle cx="460" cy="296" r="15" fill="#101114" stroke="#d7dbe2" stroke-width="2.5"/>
  <circle cx="460" cy="296" r="5.5" fill="#d7dbe2"/>

  <!-- callouts -->
  <g font-family="system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#a9aeb9">
    <line x1="295" y1="115" x2="295" y2="84" stroke="#a9aeb9" stroke-width="1"/>
    <text x="188" y="72">Unified propulsion ×2 — hover &amp; cruise</text>
    <line x1="484" y1="296" x2="562" y2="356" stroke="#a9aeb9" stroke-width="1"/>
    <text x="570" y="362">Nadir camera + AI companion</text>
    <line x1="600" y1="322" x2="648" y2="392" stroke="#a9aeb9" stroke-width="1"/>
    <text x="656" y="398">Elevons — control in both regimes</text>
    <line x1="155" y1="316" x2="200" y2="392" stroke="#a9aeb9" stroke-width="1"/>
    <text x="120" y="416">Wingtip fins double as landing gear</text>
  </g>

  <text x="26" y="38" font-family="system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="13"
        letter-spacing="3" fill="#d7dbe2">GOGEBAKAN HSVTOL — TOP VIEW</text>
  <text x="26" y="514" font-family="system-ui, Segoe UI, Roboto, Arial, sans-serif" font-size="12.5" fill="#a9aeb9">Tail-sitter: takes off nose-up on its wingtip fins, pitches over, and cruises wing-borne — one propulsion system for both regimes.</text>
</svg>
